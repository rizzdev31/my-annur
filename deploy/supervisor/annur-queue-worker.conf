; ─────────────────────────────────────────────────────────────────────────────
;  Supervisor — Worker antrean An-Nur Smart System
;  Fungsi: menjalankan `php artisan queue:work` terus-menerus agar laporan di
;  outbox terkirim otomatis ke RamahAnak; otomatis dihidupkan ulang bila mati.
;
;  Pasang di server (Linux) sebagai:
;    /etc/supervisor/conf.d/annur-queue-worker.conf
;  Lalu: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start annur-queue-worker:*
;
;  GANTI sesuai server:
;   - /var/www/annur-smart-system  → path absolut project (lokasi file artisan)
;   - user=www-data                → user pemilik aplikasi (mis. www-data / forge / nama akun hosting)
;   - php                          → path PHP bila perlu (mis. /usr/bin/php8.2)
; ─────────────────────────────────────────────────────────────────────────────

[program:annur-queue-worker]
process_name=%(program_name)s_%(process_num)02d

; Driver "database" sesuai QUEUE_CONNECTION di .env.
; --max-time=3600 : restart tiap 1 jam (cegah kebocoran memori, aman).
; --tries=5 + --backoff : selaras dgn KirimLaporanJob (retry error sementara).
command=php /var/www/annur-smart-system/artisan queue:work database --sleep=3 --tries=5 --backoff=10 --max-time=3600

directory=/var/www/annur-smart-system
user=www-data

autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true

; numprocs=1 cukup untuk volume saat ini. Naikkan (mis. 2) bila laporan sangat ramai.
numprocs=1

; Beri waktu job yang sedang jalan selesai saat worker di-stop/-restart.
stopwaitsecs=3600

redirect_stderr=true
stdout_logfile=/var/www/annur-smart-system/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
