; Konfigurasi PHP produksi (An-Nur Smart System)
;
; CATATAN memory_limit: TETAP dibatasi 256M, TIDAK diubah ke -1.
; Usulan "memory_limit = -1" beredar sebagai mitigasi php2shell (CVE-109618
; dipicu saat PHP menyentuh batas memori). Untuk server ini mitigasi itu
; merugikan: PHP kita sudah 8.2.35 (tertambal), jadi pemicunya tidak ada;
; sementara pm.max_children = 5 dan ini juga berlaku untuk CLI (queue worker +
; scheduler di container yang sama), sehingga tanpa batas satu permintaan liar
; bisa menghabiskan 7,9 GB RAM host dan OOM killer kemungkinan memilih MySQL
; (576 MB) sebagai korban. Dengan batas, kegagalan berhenti di SATU permintaan.
; Diukur 23 Okt 2026: 0 kejadian "allowed memory size" dalam 7 hari log dan
; 0 OOM di host; container app hanya memakai 110 MB. Batas ini tidak pernah
; tersentuh, jadi melepasnya tidak memberi manfaat apa pun.
memory_limit = 256M

; ── Pembatasan data masuk (mitigasi php2shell + pengurangan permukaan DoS) ──
; Plafon NYATA aplikasi ini 9 MB, dihitung dari aturan validasi kita sendiri:
;   - Saran & Masukan: 3 lampiran (MasukanService::MAKS_LAMPIRAN) x 3072 KB = 9 MB
;   - berkas tunggal terbesar: PDF berita/notulensi max:8192 KB = 8 MB
; Karena itu 8M DITOLAK sebagai pilihan: satu kiriman masukan dengan 3 foto
; penuh (9 MB) akan melebihi batas, dan saat post_max_size terlampaui PHP
; MEMBUANG SELURUH body — $_POST & $_FILES jadi kosong, sehingga pengguna
; melihat galat "kolom wajib diisi" yang menyesatkan, bukan "berkas terlalu
; besar". 16M memberi margin ~78% di atas plafon nyata dan tetap lebih ketat
; daripada 27M sebelumnya.
upload_max_filesize = 10M
post_max_size = 16M

; Mitigasi langsung php2shell (CVE-2026-109619 jalur upload progress).
; Tidak dipakai aplikasi ini sama sekali (0 rujukan di app/, resources/,
; routes/, config/) dan Laravel tidak memakainya. Dimatikan tanpa biaya.
session.upload_progress.enabled = Off

max_execution_time = 120
max_input_time = 120
expose_php = Off
date.timezone = Asia/Jakarta

; OPcache — mode produksi (timestamps=0 → cache di-reset saat container restart/deploy)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
