user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;
    # Sengaja SEDIKIT DI BAWAH post_max_size (16M) supaya nginx yang menolak
    # kiriman kelewat besar lebih dulu, dengan 413 yang jelas. Bila PHP yang
    # menolak (post_max_size terlampaui), seluruh body dibuang dan formulirnya
    # tampak kosong -> pengguna melihat "kolom wajib diisi", bukan "terlalu
    # besar". Plafon nyata aplikasi 9 MB, jadi 14m masih berlebih.
    client_max_body_size 14m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/font-woff2;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Service worker PWA — JANGAN ikut cache panjang.
        #
        # Aset Vite aman di-cache 30 hari karena namanya memuat hash isi:
        # berubah isi, berubah URL. Dua berkas ini sebaliknya ber-URL TETAP,
        # jadi aturan .js di bawah membuat versi lamanya bertahan di tepi
        # jaringan sampai 30 hari — pembaruan service worker tidak pernah
        # sampai ke HP, walau deploy-nya sudah berhasil.
        #
        # Ini location REGEX, dan nginx memilih regex yang cocok PERTAMA
        # menurut urutan penulisan — jadi blok ini wajib berada di ATAS
        # aturan .js umum di bawahnya. Dipindah ke bawah, ia tidak akan
        # pernah terpakai.
        location ~ ^/(guru|santri)-sw\.js$ {
            # `expires off` supaya nginx tidak ikut menerbitkan Cache-Control
            # sendiri — kalau dibiarkan, header ini keluar dua kali dengan isi
            # berbeda dan perantara boleh memilih yang mana saja.
            expires off;
            # `max-age=0` ditulis EKSPLISIT. Tanpa itu header ini tidak
            # memuat max-age sama sekali, dan Cloudflare mengisinya dengan
            # Browser Cache TTL bawaannya — terukur jadi max-age=14400 (4 jam).
            # Aset Vite & manifes lolos karena sudah punya max-age sendiri.
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            try_files $uri =404;
        }

        # Manifes PWA juga ber-URL tetap; sejam sudah cukup — ia jarang
        # berubah, tapi tidak boleh ikut tertahan 30 hari.
        location ~ ^/(guru|santri)-manifest\.json$ {
            expires off;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        # Aset statis dari build Vite — cache panjang, aman karena namanya
        # memuat hash isi.
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 120;
        }

        # Blokir dotfiles kecuali .well-known (ACME/HTTPS)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
