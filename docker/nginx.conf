user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;
    # Sengaja SEDIKIT DI BAWAH post_max_size (16M) supaya nginx yang menolak
    # kiriman kelewat besar lebih dulu, dengan 413 yang jelas. Bila PHP yang
    # menolak (post_max_size terlampaui), seluruh body dibuang dan formulirnya
    # tampak kosong -> pengguna melihat "kolom wajib diisi", bukan "terlalu
    # besar". Plafon nyata aplikasi 9 MB, jadi 14m masih berlebih.
    client_max_body_size 14m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/font-woff2;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Aset statis dari build Vite — cache panjang
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 120;
        }

        # Blokir dotfiles kecuali .well-known (ACME/HTTPS)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
